
server {
	host localhost
	port 2003
	server_names localhost login1.fr
 	error_page 400 502 45 
	size 200 MB
	location / {
		root ./site/dim
		index index.html [optionnel]
		method GET HK 
	}

	location /images {

		root ./site/dim/images
		method GET  aa aa
		autoindex on
	}  
	location /temp {
		redirect 300 https://login2.fr
	}

	location .php {

		SCRIPT_FILENAME ./cgi-bin
		method GET 
	}
}


