
server {
	host localhost
	port 2003
	server_names localhost login1.fr
 	error_page 404 502 ./error_page/custom1/index.html
	size 200 MB 
 
	location / {

		root ./site/dim
		index index.html [optionnel]
		method GET
	}

	location /images {

		root ./site/dim/images         
		method GET POST DELETE (another function )
		autoindex on (directory listing if no index)
	}

	location /temp {
		redirect 303 https://login2.fr
	}

	location .php { 

		SCRIPT_FILENAME ./cgi-bin
		method GET POST
	}
}

server {
	....
	server_names login2.fr
}

