server
	host localhost
	port 2003
	error_page 404 405 config/errorPage/custom/custom1.html
	size 200 B
	location /
		root ./site
		method GET POST DELETE
		autoindex ON
		cgi	ON /usr/bin/php-cgi
	location /upload
		root ./site/upload
		method GET POST DELETE
		autoindex ON

