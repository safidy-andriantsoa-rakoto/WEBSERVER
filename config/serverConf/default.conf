server {
	host localhost
	port 2003 2004 2005
	server_names localhost
	size 200 MB

	location / {
		root ./other_sites/delete
		method GET POST DELETE
		autoindex ON
		cgi	ON /usr/bin/php-cgi
	}

	location /upload {
		root ./site/upload
		method GET POST DELETE
		autoindex OFF
		cgi ON /usr/bin/php-cgi
	}

}
