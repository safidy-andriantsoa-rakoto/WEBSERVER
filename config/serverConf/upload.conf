server
	host    localhost
	port 2004
	error_page 404 ./config/errorPage/custom/custom2.html
	size 200 MB

	location /
		root other_sites/minimal
		method GET POST DELETE
		autoindex ON
		cgi	ON /usr/bin/php-cgi
		index test.html

	location /upload
		root other_sites/minimal/upload
		method GET POST DELETE
		autoindex ON
