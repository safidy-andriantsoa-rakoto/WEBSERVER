
server {
	host localhost
	port 2003
	server_names localhost login1.fr
	error_page 404 ./config/errorPage/custom/custom2.html
	size 200 MB

	location / {
		root ./site/our_webserv
		method GET
	}

	location /about {

		root ./site/our_webserv/about
		method GET
		autoindex ON
	} 
	
	location /tooplate {

		root ./site/our_webserv/tooplate
		method GET
		autoindex ON
	}

	location /custom {

		root ./config/errorPage/custom
		method GET
	}

	location /cgi-bin {

		root ./site/cgi-bin
		cgi	ON
		method GET POST DELETE
		autoindex ON
	}

}

