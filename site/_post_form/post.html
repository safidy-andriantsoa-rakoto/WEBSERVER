<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Formulaire de Contact</title>
  <style>
    :root{
      --bg:#f8fafc;        /* slate-50 */
      --panel:#ffffff;     /* white */
      --panel-2:#f1f5f9;   /* slate-100 */
      --text:#0f172a;      /* slate-900 */
      --muted:#64748b;     /* slate-500 */
      --primary:#22c55e;   /* green-500 */
      --primary-700:#15803d;
      --danger:#ef4444;    /* red-500 */
      --warning:#f59e0b;   /* amber-500 */
      --focus:#3b82f6;     /* blue-500 */
    }
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      background: radial-gradient(1200px 800px at 70% -20%, #e2e8f0 0%, var(--bg) 40%), var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
    }
    .container{
      max-width: 920px;
      margin: 0 auto;
      padding: 24px;
    }
    header{
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; padding: 12px 0 24px;
    }
    .brand{
      display:flex; align-items:center; gap:12px;
      font-weight: 700; letter-spacing: .3px;
    }
    .logo{
      width:36px; height:36px; border-radius:10px;
      display:grid; place-items:center;
      background: linear-gradient(135deg, #34d399, #22c55e 60%, #16a34a);
      box-shadow: 0 8px 28px rgba(34,197,94,.35);
      color:#ffffff; font-weight:900;
    }
    .panel{
      background: linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
      border: 1px solid rgba(0,0,0,.08);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,.08), inset 0 1px 0 rgba(255,255,255,.8);
    }

    .form-group{
      display:grid; gap:16px;
    }
    .form-field{
      display:flex; flex-direction:column; gap:8px;
    }
    .form-row{
      display:flex; gap:16px;
    }
    .form-row .form-field{
      flex:1;
    }
    label{
      font-weight: 600; color: var(--text); font-size: 14px;
    }
    .required::after{
      content: " *"; color: var(--danger);
    }
    .form-input, .form-textarea, .form-select, .form-date{
      padding: 12px 16px; border-radius: 12px;
      border: 1px solid rgba(0,0,0,.15); background: #ffffff;
      font-size: 16px; transition: border-color .2s, box-shadow .2s;
      font-family: inherit;
    }
    .form-input:focus, .form-textarea:focus, .form-select:focus, .form-date:focus{
      outline: none; border-color: var(--focus);
      box-shadow: 0 0 0 3px rgba(59,130,246,.1);
    }
    .form-textarea{
      resize: vertical; min-height: 120px;
    }
    .form-date{
      cursor: pointer;
    }
    .hint{
      color: var(--muted); font-size: 13px; margin-top: 4px;
    }

    .actions{
      display:flex; gap:12px; flex-wrap:wrap; justify-content:flex-end;
      margin-top: 24px; padding-top: 20px; border-top: 1px solid rgba(0,0,0,.08);
    }
    .btn{
      appearance:none; border:none; cursor:pointer;
      border-radius:12px; padding:12px 24px; font-weight:600;
      color:#0b1215; background: #f1f5f9; transition: transform .02s ease, box-shadow .2s;
      box-shadow: 0 4px 12px rgba(0,0,0,.1); font-size: 16px;
    }
    .btn:hover { background: #e2e8f0; }
    .btn:active{ transform: translateY(1px); }
    .btn.primary{ background: linear-gradient(180deg, #34d399, #22c55e); color:#ffffff; }
    .btn.primary:hover { background: linear-gradient(180deg, #22c55e, #16a34a); }
    .btn.ghost{ background: transparent; color: var(--text); border:1px solid rgba(0,0,0,.15); }
    .btn.ghost:hover { background: rgba(0,0,0,.05); }

    .success-message{
      background: linear-gradient(135deg, #dcfce7, #bbf7d0);
      border: 1px solid #22c55e; border-radius: 12px;
      padding: 16px; margin-bottom: 20px; color: #15803d;
    }
    .error-message{
      background: linear-gradient(135deg, #fee2e2, #fecaca);
      border: 1px solid #ef4444; border-radius: 12px;
      padding: 16px; margin-bottom: 20px; color: #b91c1c;
    }

    .result-box{
      margin-top: 24px;
      padding: 20px;
      border-radius: 12px;
      background: rgba(0,0,0,.02);
      border: 1px solid rgba(0,0,0,.08);
      font-family: monospace;
      white-space: pre-wrap;
      word-break: break-all;
      min-height: 100px;
      font-size: 14px;
    }
    .result-box.success{
      background: rgba(34,197,94,.05);
      border-color: rgba(34,197,94,.3);
      color: #15803d;
    }
    .result-box.error{
      background: rgba(239,68,68,.05);
      border-color: rgba(239,68,68,.3);
      color: #b91c1c;
    }

    .loading {
      opacity: 0.7;
      pointer-events: none;
    }

    footer{
      margin-top:32px; color: var(--muted); font-size: 13px; text-align:center;
    }

    @media (max-width: 560px){
      .form-row{ flex-direction: column; }
      .actions{ flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <div class="logo"><a href="/">F</a></div>
        <div>Formulaire de Contact</div>
      </div>
    </header>

    <main class="panel">
      <div id="message" style="display: none;"></div>

      <form id="contactForm" class="form-group" method="post" action="/submit">
        <div class="form-row">
          <div class="form-field">
            <label for="firstName" class="required">Prénom</label>
            <input type="text" id="firstName" name="firstName" class="form-input" placeholder="Votre prénom" required>
          </div>
          <div class="form-field">
            <label for="lastName" class="required">Nom</label>
            <input type="text" id="lastName" name="lastName" class="form-input" placeholder="Votre nom" required>
          </div>
        </div>

        <div class="form-field">
          <label for="email" class="required">Email</label>
          <input type="email" id="email" name="email" class="form-input" placeholder="votre@email.com" required>
          <div class="hint">Nous ne partagerons jamais votre email.</div>
        </div>

        <div class="form-row">
          <div class="form-field">
            <label for="date" class="required">Date</label>
            <input type="date" id="date" name="date" class="form-date" required>
            <div class="hint">Sélectionnez une date</div>
          </div>
          <div class="form-field">
            <label for="time">Heure</label>
            <input type="time" id="time" name="time" class="form-date">
            <div class="hint">Heure optionnelle</div>
          </div>
        </div>

        <div class="form-field">
          <label for="description" class="required">Description</label>
          <textarea id="description" name="description" class="form-textarea" placeholder="Décrivez votre demande..." required maxlength="500"></textarea>
          <div class="hint">Maximum 500 caractères. <span id="charCount">500</span> restants</div>
        </div>

        <div class="actions">
          <button type="reset" class="btn ghost">Réinitialiser</button>
          <button type="submit" class="btn primary" id="submitBtn">
            Envoyer le formulaire
          </button>
        </div>
      </form>

      <div id="result" class="result-box">
        Résultat apparaîtra ici...
      </div>
    </main>

    <footer>
      Formulaire avec JavaScript • Action POST vers /submit (URL encoded)
    </footer>
  </div>

  <script>
    // Compteur de caractères pour la description
    const description = document.getElementById('description');
    const charCount = document.getElementById('charCount');

    description.addEventListener('input', function() {
      const remaining = 500 - this.value.length;
      charCount.textContent = remaining;
    });

    // Fonction pour encoder les données en format x-www-form-urlencoded
    function urlEncodeFormData(formData) {
      const params = new URLSearchParams();
      
      // Ajouter chaque paire clé-valeur
      for (const [key, value] of formData.entries()) {
        params.append(key, value);
      }
      
      return params.toString();
    }

    // Gestion de la soumission du formulaire
    const contactForm = document.getElementById('contactForm');
    const resultElement = document.getElementById('result');
    const messageElement = document.getElementById('message');
    const submitBtn = document.getElementById('submitBtn');

    contactForm.addEventListener('submit', async function(e) {
      e.preventDefault();
      
      // Désactiver le bouton pendant l'envoi
      submitBtn.disabled = true;
      contactForm.classList.add('loading');
      resultElement.textContent = 'Envoi en cours...';
      resultElement.className = 'result-box';

      try {
        // Récupérer les données du formulaire
        const formData = new FormData(this);
        
        // Encoder les données en format x-www-form-urlencoded
        const encodedData = urlEncodeFormData(formData);

        // Afficher les données envoyées pour debug
        console.log('Données envoyées:', encodedData);

        // Envoyer la requête POST avec x-www-form-urlencoded
        const response = await fetch('/submit', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8'
          },
          body: encodedData
        });

        // Vérifier si la réponse est OK
        if (response.ok) {
          const result = await response.text();
          
          // Succès
          resultElement.textContent = '✅ SUCCÈS!\n\n' + 
            'Status: ' + response.status + ' ' + response.statusText + '\n' +
            'Content-Type: application/x-www-form-urlencoded\n' +
            'Données envoyées: ' + encodedData + '\n\n' +
            'Réponse du serveur: ' + result;
          resultElement.className = 'result-box success';
          
          // Afficher message de succès
          showMessage('✅ Formulaire envoyé avec succès !', 'success');
          
          // Réinitialiser le formulaire après succès
          setTimeout(() => {
            contactForm.reset();
            charCount.textContent = '500';
          }, 10000);
          
        } else {
          // Erreur HTTP
          const errorText = await response.text();
          resultElement.textContent = '❌ ERREUR!\n\n' +
            'Status: ' + response.status + ' ' + response.statusText + '\n' +
            'Content-Type: application/x-www-form-urlencoded\n' +
            'Données envoyées: ' + encodedData + '\n\n' +
            'Message d\'erreur: ' + errorText;
          resultElement.className = 'result-box error';
          
          showMessage('❌ Erreur lors de l\'envoi du formulaire.', 'error');
        }

      } catch (error) {
        // Erreur réseau
        resultElement.textContent = '❌ ERREUR RÉSEAU!\n\n' + error.message;
        resultElement.className = 'result-box error';
        
        showMessage('❌ Erreur réseau lors de l\'envoi.', 'error');
      } finally {
        // Réactiver le bouton
        submitBtn.disabled = false;
        contactForm.classList.remove('loading');
      }
    });

    // Fonction pour afficher les messages
    function showMessage(text, type) {
      messageElement.textContent = text;
      messageElement.className = type === 'success' ? 'success-message' : 'error-message';
      messageElement.style.display = 'block';
      
      // Cacher le message après 5 secondes
      setTimeout(() => {
        messageElement.style.display = 'none';
      }, 10000);
    }

    // Gestion de la réinitialisation
    contactForm.addEventListener('reset', function() {
      resultElement.textContent = 'Résultat apparaîtra ici...';
      resultElement.className = 'result-box';
      messageElement.style.display = 'none';
      charCount.textContent = '500';
    });

    // Alternative: version avec XMLHttpRequest pour plus de compatibilité
    function submitFormXHR(formData) {
      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        const encodedData = urlEncodeFormData(formData);
        
        xhr.open('POST', '/submit');
        xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
        
        xhr.onload = function() {
          if (xhr.status >= 200 && xhr.status < 300) {
            resolve({
              status: xhr.status,
              statusText: xhr.statusText,
              responseText: xhr.responseText
            });
          } else {
            reject({
              status: xhr.status,
              statusText: xhr.statusText,
              responseText: xhr.responseText
            });
          }
        };
        
        xhr.onerror = function() {
          reject(new Error('Erreur réseau'));
        };
        
        xhr.send(encodedData);
      });
    }
  </script>
</body>
</html>
