<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Test POST Chunked avec Fichier</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 20px; }
    h1 { font-size: 1.4em; }
    input, button { width: 100%; padding: 10px; margin-top: 8px; box-sizing: border-box; font-size: 1em; }
    pre { background: #111; color: #fff; padding: 10px; border-radius: 6px; white-space: pre-wrap; margin-top: 12px; }
  </style>
</head>
<body>
  <h1>Tester HTTP POST (Chunked) avec Fichier</h1>

  <label for="fileInput">Sélectionner un fichier :</label>
  <input id="fileInput" type="file" />

  <button id="sendBtn">Envoyer</button>

  <h3>Résultat :</h3>
  <pre id="output">-- aucun envoi encore --</pre>

  <script>
    async function sendFileChunked(file) {
      const url = window.location.pathname; // envoie vers le même serveur et chemin courant

      const stream = new ReadableStream({
        start(controller) {
          const reader = file.stream().getReader();
          function push() {
            reader.read().then(({ done, value }) => {
              if (done) {
                controller.close();
                return;
              }
              controller.enqueue(value);
              push();
            });
          }
          push();
        }
      });

      const response = await fetch(url, {
        method: 'POST',
        body: stream,
        headers: {
          'Content-Type': 'application/octet-stream'
        }
      });

      const body = await response.text();
      return 'Status: ' + response.status + ' ' + response.statusText + '\n' + body;
    }

    document.getElementById('sendBtn').addEventListener('click', async () => {
      const fileInput = document.getElementById('fileInput');
      const output = document.getElementById('output');

      if (!fileInput.files.length) {
        output.textContent = 'Veuillez sélectionner un fichier.';
        return;
      }

      const file = fileInput.files[0];
      output.textContent = 'Envoi du fichier "' + file.name + '" en chunks...';

      try {
        const result = await sendFileChunked(file);
        output.textContent = result;
      } catch (err) {
        output.textContent = 'Erreur : ' + err;
      }
    });
  </script>
</body>
</html>
