<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Test Méthode DELETE</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
    h1 { font-size: 1.5em; margin-bottom: 10px; }
    input[type="text"] { width: 100%; padding: 10px; font-size: 1em; margin-top: 10px; }
    button { padding: 10px 15px; margin-top: 10px; font-size: 1em; cursor: pointer; }
    #result { margin-top: 20px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Tester la méthode HTTP DELETE</h1>
  <p>Entrez le chemin de la ressource à supprimer :</p>
  <input id="pathInput" type="text" placeholder="/fichier.txt" />
  <button id="deleteBtn">Supprimer</button>
  <div id="result"></div>

  <script>
    document.getElementById('deleteBtn').addEventListener('click', function() {
      var path = document.getElementById('pathInput').value.trim();
      if (!path) {
        document.getElementById('result').textContent = 'Veuillez entrer un chemin.';
        return;
      }
      if (path[0] !== '/') path = '/' + path;

      var url = window.location.origin + path;
      document.getElementById('result').textContent = 'Envoi DELETE vers ' + url + '...';

      fetch(url, { method: 'DELETE' })
        .then(resp => resp.text().then(text => {
          document.getElementById('result').textContent = 'Réponse : ' + resp.status + ' ' + resp.statusText + '\n' + text;
        }))
        .catch(err => {
          document.getElementById('result').textContent = 'Erreur : ' + err;
        });
    });
  </script>
</body>
</html>
